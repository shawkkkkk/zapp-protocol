name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Check inscription signer
        run: cargo check --manifest-path native/zapp-zcash-signer/Cargo.toml
      - name: Self-test inscription signer
        run: cargo run --quiet --manifest-path native/zapp-zcash-signer/Cargo.toml -- --self-test
      - name: Validate production compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet
