[package]
name = "zapp-zcash-signer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"
secp256k1 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_primitives = "0.30.0"
zcash_protocol = "0.10.3"
transparent = { package = "zcash_transparent", version = "0.10.0" }
zcash_script = "0.4"
